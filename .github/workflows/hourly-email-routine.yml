name: Hourly Email Routine

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  email-routine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agent repo
        uses: actions/checkout@v4
        with:
          path: agent

      - name: Checkout Data repo
        uses: actions/checkout@v4
        with:
          repository: dh-operator/Data
          path: data
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true

      - name: Checkout System repo
        uses: actions/checkout@v4
        with:
          repository: dh-operator/System
          path: system
          token: ${{ secrets.CROSS_REPO_TOKEN }}
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Debug - check secrets and network
        working-directory: agent
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
        run: |
          echo "=== 환경 확인 ==="
          echo "IMAP_HOST 설정 여부: $([ -n "$IMAP_HOST" ] && echo YES || echo NO)"
          echo "IMAP_USER 설정 여부: $([ -n "$IMAP_USER" ] && echo YES || echo NO)"
          echo "Python 버전: $(python3 --version)"
          echo "=== 네트워크 테스트 ==="
          nc -zv imap.mail.me.com 993 2>&1 || echo "IMAP 993 접근 불가"
          nc -zv smtp.mail.me.com 587 2>&1 || echo "SMTP 587 접근 불가"
          nc -zv smtp.mail.me.com 465 2>&1 || echo "SMTP 465 접근 불가"
          echo "=== 스크립트 파일 확인 ==="
          ls -la scripts/
          echo "=== 완료 ==="

      - name: Run email routine
        working-directory: agent
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AGENT_REPO: dh-operator/Agent
          DATA_REPO: dh-operator/Data
          SYSTEM_REPO: dh-operator/System
          GITHUB_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: python scripts/email_routine.py

      - name: Relay processed results back to senders
        working-directory: agent
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AGENT_REPO: dh914/Agent
          GITHUB_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: python scripts/relay_results.py

      - name: Commit email logs to Agent repo
        working-directory: agent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          if [ -n "$(git status --porcelain logs/ incoming/)" ]; then
            git add logs/ incoming/
            git commit -m "chore(routine): hourly email log $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3 4; do
              git push && break || sleep $((2 ** i))
            done
          fi

      - name: Report run to System repo
        if: always()
        working-directory: agent
        env:
          GITHUB_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          python scripts/report_to_system.py --status "${{ job.status }}" --run-id "${{ github.run_id }}" || true
